<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Futsal Club — Gestión de planteles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>

  <!-- Pantalla de ingreso -->
  <section id="vista-login" class="login-contenedor" hidden>
    <form id="form-login" class="card shadow-sm p-4 login-tarjeta" novalidate>
      <h1 class="h4 mb-1">Futsal Club</h1>
      <p class="text-muted mb-3">Gestión de planteles</p>
      <div id="login-aviso" class="alert alert-danger d-none" role="alert"></div>
      <label for="login-email" class="form-label">Email</label>
      <input id="login-email" type="email" class="form-control mb-3" autocomplete="username" required>
      <label for="login-password" class="form-label">Contraseña</label>
      <input id="login-password" type="password" class="form-control mb-3" autocomplete="current-password" required>
      <button id="login-boton" type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </section>

  <!-- Aplicación -->
  <div id="vista-app" hidden>
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Futsal Club</span>
        <div class="d-flex align-items-center gap-2 text-white">
          <span id="usuario-nombre"></span>
          <span id="usuario-rol" class="badge text-bg-secondary"></span>
          <button id="boton-salir" type="button" class="btn btn-outline-light btn-sm">Salir</button>
        </div>
      </div>
    </nav>
    <main class="container py-3">
      <ul class="nav nav-tabs mb-3" id="pestanias">
        <li class="nav-item"><button class="nav-link active" data-vista="plantel" type="button">Plantel</button></li>
        <li class="nav-item"><button class="nav-link" data-vista="partidos" type="button">Partidos</button></li>
        <li class="nav-item"><button class="nav-link" data-vista="resumen" type="button">Resumen</button></li>
      </ul>
      <div id="contenido"></div>
    </main>
  </div>

  <dialog id="dialogo"></dialog>
  <div id="avisos" class="avisos"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
